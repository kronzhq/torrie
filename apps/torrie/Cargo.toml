[package]
name = "torrie"
version = "1.1.1"
edition = "2024"
description = "A simple BitTorrent client for macOS built with GPUI"
license = "MIT"
authors = ["Kronz <https://kronz.xyz>"]
homepage = "https://kronz.xyz"
repository = "https://github.com/kronzhq/torrie"
publish = false

[dependencies]
anyhow = "1"
# Remote control server; both already built for librqbit/gpui.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
base64 = "0.22"
block2 = "0.6"
# runtime_shaders: no Xcode Metal Toolchain needed to build
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
humansize = "2.1.3"
libc = "0.2"
librqbit = "9.0.1"
maxminddb = "0.32.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibility", "NSAlert", "NSApplication", "NSResponder", "NSWorkspace", "NSView", "NSWindow", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
# Streaming a file to a player; already built for librqbit.
tokio-util = { version = "0.7", features = ["io"] }
tray-icon = "0.26.1"
unicode-segmentation = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
